<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketing Detective</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  :root{
    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    --font-hand: 'Segoe Print', 'Comic Sans MS', cursive;
  }

  /* ===== THEME: Claude Orange ===== */
  [data-theme="claude"]{
    --bg-deep:#181210;
    --bg-panel:#1f1712;
    --accent:#d97757;
    --accent-strong:#f0946e;
    --accent-glow: rgba(217,119,87,0.45);
    --text-main:#f3e9df;
    --text-dim:#c9b8a8;
    --border-soft: rgba(217,119,87,0.35);
  }
  /* ===== THEME: Classic Noir ===== */
  [data-theme="noir"]{
    --bg-deep:#0b0b0c;
    --bg-panel:#161617;
    --accent:#e2434d;
    --accent-strong:#ff6b74;
    --accent-glow: rgba(226,67,77,0.45);
    --text-main:#f0f0f0;
    --text-dim:#b7b7b9;
    --border-soft: rgba(226,67,77,0.35);
  }
  /* ===== THEME: Emerald Files ===== */
  [data-theme="emerald"]{
    --bg-deep:#0e1712;
    --bg-panel:#152019;
    --accent:#3fae72;
    --accent-strong:#6fd39a;
    --accent-glow: rgba(63,174,114,0.4);
    --text-main:#e9f3ec;
    --text-dim:#b3c7ba;
    --border-soft: rgba(212,175,55,0.35);
  }
  /* ===== THEME: Midnight Blue ===== */
  [data-theme="midnight"]{
    --bg-deep:#0a0f1f;
    --bg-panel:#111a30;
    --accent:#4fb0e0;
    --accent-strong:#7ccdf5;
    --accent-glow: rgba(79,176,224,0.45);
    --text-main:#e8f1fb;
    --text-dim:#a9bcd6;
    --border-soft: rgba(79,176,224,0.35);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse at top, var(--bg-panel), var(--bg-deep) 70%);
    color: var(--text-main);
    font-family: var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }
  #root{ min-height:100vh; }

  ::selection{ background: var(--accent); color:#181210; }

  .app-shell{
    max-width:1180px;
    margin:0 auto;
    padding:22px 18px 60px;
    position:relative;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family: var(--font-display);
    letter-spacing:2px;
    font-size:1.3rem;
    text-transform:uppercase;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-strong), var(--accent) 60%, #000 130%);
    box-shadow: 0 0 18px var(--accent-glow);
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;
  }
  .brand small{
    display:block;
    font-family: var(--font-body);
    letter-spacing:1px;
    font-size:0.6rem;
    color: var(--text-dim);
    text-transform:none;
  }
  .case-tag{
    font-size:0.75rem;
    color: var(--text-dim);
    border:1px solid var(--border-soft);
    padding:5px 12px;
    border-radius:20px;
    background: rgba(0,0,0,0.25);
    letter-spacing:0.5px;
  }

  /* ---------- Progress Stepper ---------- */
  .stepper{
    display:flex;
    gap:4px;
    margin-bottom:26px;
    background: rgba(0,0,0,0.25);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:10px 12px;
    overflow-x:auto;
  }
  .step{
    flex:1;
    min-width:90px;
    text-align:center;
    font-size:0.62rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color: var(--text-dim);
    padding:8px 4px 10px;
    position:relative;
  }
  .step:not(:last-child)::after{
    content:'';
    position:absolute;
    right:-4px; top:14px;
    width:8px;height:2px;
    background: var(--border-soft);
  }
  .step .dot{
    width:20px;height:20px;
    margin:0 auto 6px;
    border-radius:50%;
    border:2px solid var(--border-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:0.6rem;
    color: var(--text-dim);
    background: rgba(0,0,0,0.3);
    transition: all .35s ease;
  }
  .step.active .dot{
    border-color: var(--accent);
    background: var(--accent);
    color:#161010;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .step.done .dot{
    border-color: var(--accent);
    background: transparent;
    color: var(--accent);
  }
  .step.active{ color: var(--text-main); }

  /* ---------- Screen fade transitions ---------- */
  .screen{
    animation: fadeSlideIn .55s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes fadeSlideIn{
    from{ opacity:0; transform: translateY(16px); }
    to{ opacity:1; transform:none; }
  }

  .btn{
    font-family: var(--font-body);
    font-weight:600;
    letter-spacing:0.4px;
    font-size:0.9rem;
    padding:12px 26px;
    border-radius:8px;
    border:1px solid var(--accent);
    background: linear-gradient(160deg, var(--accent-strong), var(--accent));
    color:#181109;
    cursor:pointer;
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    box-shadow: 0 4px 18px var(--accent-glow);
  }
  .btn:hover{ transform: translateY(-2px); filter:brightness(1.08); }
  .btn:active{ transform: translateY(0px) scale(.98); }
  .btn:disabled{
    opacity:0.35; cursor:not-allowed; box-shadow:none; filter:none; transform:none;
  }
  .btn.ghost{
    background: transparent;
    color: var(--text-main);
    box-shadow:none;
    border:1px solid var(--border-soft);
  }
  .btn.ghost:hover{ border-color: var(--accent); color: var(--accent-strong); }

  .center-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* ---------- Theme Select Screen ---------- */
  .theme-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 16px;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.02), transparent 45%),
      #100c0a;
  }
  .theme-card{
    max-width:640px;
    width:100%;
    background: rgba(20,15,12,0.7);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:38px 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
  }
  .theme-card h1{
    font-family: var(--font-display);
    font-size:2rem;
    margin:0 0 6px;
    letter-spacing:1px;
    color:#f2e9de;
  }
  .theme-card .tagline{
    color:#b6a99b;
    font-size:0.95rem;
    margin-bottom:26px;
    line-height:1.5;
  }
  .theme-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:14px;
    margin-bottom:10px;
  }
  @media (max-width:480px){ .theme-grid{ grid-template-columns:1fr; } }

  .theme-option{
    border:2px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:16px;
    cursor:pointer;
    text-align:left;
    background: rgba(255,255,255,0.02);
    transition: all .2s ease;
    position:relative;
    overflow:hidden;
  }
  .theme-option:hover{ transform: translateY(-3px); border-color: rgba(255,255,255,0.25); }
  .theme-option.selected{ border-color: var(--sw-accent); box-shadow: 0 0 0 3px var(--sw-accent-glow); }
  .swatch-row{ display:flex; gap:6px; margin-bottom:12px; }
  .swatch{ width:22px;height:22px;border-radius:50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); }
  .theme-option .t-name{ font-weight:700; font-size:0.95rem; margin-bottom:2px; color:#f2e9de; }
  .theme-option .t-desc{ font-size:0.75rem; color:#9d9086; }
  .theme-check{
    position:absolute; top:10px; right:10px;
    width:20px;height:20px;border-radius:50%;
    background: var(--sw-accent);
    color:#141010;
    display:flex;align-items:center;justify-content:center;
    font-size:0.7rem; font-weight:900;
    opacity:0; transform:scale(0.5);
    transition: all .2s ease;
  }
  .theme-option.selected .theme-check{ opacity:1; transform:scale(1); }

  .theme-cta{ margin-top:24px; display:flex; justify-content:flex-end; }

  /* ---------- Manila Folder (Case Assignment) ---------- */
  .folder-wrap{
    display:flex; justify-content:center; padding: 30px 0 10px;
  }
  .folder{
    width:min(520px, 90vw);
    background: linear-gradient(160deg,#e8cf9e,#d8b47c);
    border-radius: 4px 14px 10px 10px;
    position:relative;
    padding:34px 28px 40px;
    color:#3a2c18;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.08);
    cursor:pointer;
    transition: transform .3s ease;
  }
  .folder:hover{ transform: translateY(-4px) rotate(-0.4deg); }
  .folder::before{
    content:'';
    position:absolute;
    top:-16px; left:24px;
    width:120px; height:20px;
    background: linear-gradient(160deg,#e8cf9e,#d8b47c);
    border-radius: 8px 8px 0 0;
  }
  .folder .stamp-corner{
    position:absolute; top:16px; right:16px;
    border:3px solid #b23b3b;
    color:#b23b3b;
    font-weight:900;
    font-family: var(--font-display);
    padding:4px 10px;
    border-radius:4px;
    transform: rotate(8deg);
    font-size:0.75rem;
    letter-spacing:1px;
    opacity:0.85;
  }
  .folder h2{
    font-family: var(--font-display);
    font-size:1.5rem;
    margin:6px 0 4px;
  }
  .folder p.sub{
    font-size:0.85rem;
    color:#5b4a30;
    margin:0 0 18px;
  }
  .folder .tap-hint{
    font-size:0.8rem;
    color:#7a5f34;
    font-style:italic;
    margin-top:16px;
  }
  .tape{
    position:absolute;
    width:80px; height:26px;
    background: rgba(255,255,255,0.35);
    border:1px solid rgba(255,255,255,0.5);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .brief-details{
    margin-top:18px;
    border-top:1px dashed rgba(58,44,24,0.4);
    padding-top:16px;
    text-align:left;
    animation: fadeSlideIn .5s ease;
  }
  .brief-row{ margin-bottom:10px; font-size:0.9rem; }
  .brief-row b{ display:block; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.6px; color:#7a5f34; margin-bottom:2px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .chip{
    background: rgba(58,44,24,0.12);
    border:1px solid rgba(58,44,24,0.25);
    padding:3px 10px;
    border-radius:20px;
    font-size:0.75rem;
  }

  .panel-actions{ display:flex; justify-content:center; gap:12px; margin-top:26px; flex-wrap:wrap; }

  /* ---------- Investigation Board (overview) ---------- */
  .cork{
    background:
      radial-gradient(circle at 8% 12%, rgba(0,0,0,0.25) 0, transparent 3%),
      radial-gradient(circle at 22% 68%, rgba(0,0,0,0.2) 0, transparent 3%),
      radial-gradient(circle at 55% 30%, rgba(0,0,0,0.22) 0, transparent 3%),
      radial-gradient(circle at 78% 75%, rgba(0,0,0,0.22) 0, transparent 3%),
      radial-gradient(circle at 90% 20%, rgba(0,0,0,0.2) 0, transparent 3%),
      radial-gradient(circle at 40% 88%, rgba(0,0,0,0.2) 0, transparent 3%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 6px),
      linear-gradient(160deg,#6b4a2f,#4a3220 60%, #3a2718);
    border-radius:16px;
    border:10px solid #2c1d12;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.5);
    padding:26px;
    position:relative;
    min-height:420px;
  }

  .board-title{
    font-family: var(--font-display);
    font-size:1.3rem;
    color:#f4e6cf;
    text-align:center;
    margin:0 0 4px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  .board-subtitle{
    text-align:center;
    color:#d9c6a8;
    font-size:0.8rem;
    margin-bottom:22px;
  }

  .overview-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(230px,1fr));
    gap:20px;
  }

  .index-card{
    background: linear-gradient(180deg,#fbf6ea,#f1e6cd);
    color:#2c2013;
    border-radius:6px;
    padding:16px 16px 18px;
    box-shadow: 0 12px 26px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(0,0,0,0.05);
    position:relative;
    transform: rotate(var(--rot,0deg));
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .index-card:hover{ transform: rotate(0deg) translateY(-4px) scale(1.02); box-shadow:0 18px 34px rgba(0,0,0,0.5); z-index:5; }
  .index-card h4{
    margin:0 0 8px;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color: var(--accent);
    display:flex; align-items:center; gap:6px;
  }
  .index-card p{ margin:0; font-size:0.88rem; line-height:1.4; }
  .pin{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:16px; height:16px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-strong), var(--accent) 70%);
    box-shadow: 0 3px 6px rgba(0,0,0,0.5), 0 0 8px var(--accent-glow);
  }

  .mini-bar-row{ display:flex; align-items:center; gap:8px; margin:6px 0; font-size:0.72rem; }
  .mini-bar-track{ flex:1; height:7px; background:rgba(0,0,0,0.12); border-radius:6px; overflow:hidden; }
  .mini-bar-fill{ height:100%; border-radius:6px; width:0%; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); transition: width 1.1s cubic-bezier(.2,.8,.3,1); }
  .mini-label{ width:78px; color:#4a3a24; font-weight:700; }
  .mini-val{ width:56px; text-align:right; color:#4a3a24; font-weight:700; }

  /* ---------- Interactive Investigation (drag corkboard) ---------- */
  .investigate-cork{
    min-height:640px;
    position:relative;
  }
  .free-note{
    position:absolute;
    width:220px;
    cursor:grab;
    user-select:none;
    touch-action:none;
  }
  .free-note.dragging{ cursor:grabbing; z-index:50; }
  .sticky{
    background: linear-gradient(180deg,#fff6cf,#fbe58f);
    color:#3a3110;
    border-radius:3px;
    padding:14px 14px 16px;
    box-shadow: 4px 10px 18px rgba(0,0,0,0.45);
    position:relative;
    font-size:0.82rem;
    line-height:1.4;
  }
  .sticky.alt{ background: linear-gradient(180deg,#dff2ff,#b9e2ff); color:#1c2c38; }
  .sticky.rose{ background: linear-gradient(180deg,#ffe3e3,#ffc2c2); color:#3a1414; }
  .sticky h5{
    margin:0 0 6px; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.6px;
    display:flex; align-items:center; gap:6px; opacity:0.75;
  }
  .sticky ul{ margin:4px 0 0; padding-left:16px; }
  .sticky li{ margin-bottom:4px; }
  .quote{ font-style:italic; margin-bottom:6px; }
  .quote:before{ content:'\201C'; } .quote:after{ content:'\201D'; }

  .stacked-mobile .free-note{ position:static; margin-bottom:16px; width:100%; transform:none !important; }

  .clue-card{
    position:absolute;
    width:190px; height:130px;
    perspective:900px;
    cursor:pointer;
  }
  .clue-inner{
    position:relative; width:100%; height:100%;
    transition: transform .6s cubic-bezier(.2,.8,.3,1);
    transform-style:preserve-3d;
  }
  .clue-card.flipped .clue-inner{ transform: rotateY(180deg); }
  .clue-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:12px;
    text-align:center;
    box-shadow: 0 10px 22px rgba(0,0,0,0.5);
  }
  .clue-front{
    background: repeating-linear-gradient(135deg,#7a1f1f,#7a1f1f 6px,#6a1919 6px,#6a1919 12px);
    color:#ffe9e9;
    font-family: var(--font-display);
    letter-spacing:1px;
    border: 2px dashed rgba(255,255,255,0.35);
  }
  .clue-back{
    background: linear-gradient(180deg,#fbf6ea,#efe0bf);
    color:#2c2013;
    transform: rotateY(180deg);
    font-size:0.78rem;
    line-height:1.35;
  }
  .stacked-mobile .clue-card{ position:static; width:100%; height:auto; min-height:110px; margin-bottom:16px; }

  .investigate-toolbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    margin-bottom:16px;
  }
  .clue-progress{ font-size:0.8rem; color:#e9dcc2; }
  .clue-progress b{ color: var(--accent-strong); }

  /* ---------- Solve Screen ---------- */
  .lineup{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
    gap:16px;
    margin:24px 0 8px;
  }
  .suspect-card{
    background: var(--bg-panel);
    border:2px solid var(--border-soft);
    border-radius:12px;
    padding:18px;
    cursor:pointer;
    transition: all .2s ease;
    position:relative;
  }
  .suspect-card:hover{ border-color: var(--accent); transform: translateY(-3px); }
  .suspect-card.selected{
    border-color: var(--accent);
    background: linear-gradient(160deg, rgba(255,255,255,0.05), transparent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .suspect-letter{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%;
    border:1px solid var(--border-soft);
    font-size:0.75rem; font-weight:800;
    margin-bottom:10px;
    color: var(--text-dim);
  }
  .suspect-card.selected .suspect-letter{ background: var(--accent); border-color: var(--accent); color:#181109; }
  .suspect-card p{ margin:0; font-size:0.88rem; line-height:1.45; color: var(--text-main); }

  .solve-head{ text-align:center; margin-bottom:6px; }
  .solve-head h2{ font-family: var(--font-display); margin:0 0 6px; letter-spacing:0.5px; }
  .solve-head p{ color: var(--text-dim); font-size:0.9rem; }

  /* ---------- Case Closed ---------- */
  .closed-screen{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:60vh; text-align:center; position:relative;
  }
  .stamp{
    font-family: var(--font-display);
    font-weight:900;
    font-size:clamp(2rem,7vw,4.2rem);
    letter-spacing:4px;
    border:8px solid currentColor;
    padding:14px 34px;
    border-radius:10px;
    transform: rotate(-9deg) scale(2.4);
    opacity:0;
    animation: stampDown .55s .15s cubic-bezier(.15,.9,.35,1) forwards;
  }
  .stamp.correct{ color:#57c26a; text-shadow:0 0 30px rgba(87,194,106,0.5); }
  .stamp.wrong{ color:#e05a5a; text-shadow:0 0 30px rgba(224,90,90,0.5); }
  @keyframes stampDown{
    0%{ opacity:0; transform: rotate(-9deg) scale(2.6); }
    60%{ opacity:1; transform: rotate(-9deg) scale(0.94); }
    80%{ transform: rotate(-9deg) scale(1.05); }
    100%{ opacity:1; transform: rotate(-9deg) scale(1); }
  }
  .closed-sub{
    margin-top:26px; color: var(--text-dim); font-size:0.95rem;
    opacity:0; animation: fadeSlideIn .6s 1s forwards;
  }
  .closed-actions{ margin-top:22px; opacity:0; animation: fadeSlideIn .6s 1.3s forwards; }

  .confetti-bit{
    position:absolute; top:-10px; width:8px; height:14px;
    animation: fall linear forwards;
    opacity:0.9;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(400deg); opacity:0.2; }
  }

  /* ---------- Learning Report ---------- */
  .report-grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:22px; }
  @media (max-width: 800px){ .report-grid{ grid-template-columns:1fr; } }
  .report-card{
    background: var(--bg-panel);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:22px;
    margin-bottom:18px;
  }
  .report-card h3{
    margin:0 0 12px; font-family:var(--font-display); font-size:1.05rem;
    color: var(--accent-strong); display:flex; align-items:center; gap:8px;
  }

/* ============ HELPERS ============ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function randomCase(excludeId){
  const pool = excludeId ? CASES.filter(c=>c.id!==excludeId) : CASES;
  return pool[Math.floor(Math.random()*pool.length)];
}
function buildOptions(theCase){
  const others = shuffle(CASES.filter(c=>c.id!==theCase.id)).slice(0,3);
  const opts = shuffle([theCase.mistake, ...others.map(o=>o.mistake)]);
  return opts;
}

const STEPS = [`Case Assignment`,`Investigation Board`,`Interactive Investigation`,`Solve the Case`,`Case Closed`,`Learning Report`];

/* ============ STEPPER ============ */
function Stepper({ current }){
  return (
    <div className="stepper">
      {STEPS.map((label, i)=>{
        const idx = i+1;
        let cls = 'step';
        if(idx === current) cls += ' active';
        else if(idx < current) cls += ' done';
        return (
          <div className={cls} key={label}>
            <div className="dot">{idx < current ? '✓' : idx}</div>
            {label}
          </div>
        );
      })}
    </div>
  );
}

/* ============ DRAGGABLE NOTE ============ */
function DraggableNote({ id, pos, onDrag, isDesktop, children, rotation }){
  const ref = useRef(null);
  const dragState = useRef(null);

  const onPointerDown = (e)=>{
    if(!isDesktop) return;
    const rect = ref.current.getBoundingClientRect();
    const parentRect = ref.current.parentElement.getBoundingClientRect();
    dragState.current = {
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      parentRect
    };
    ref.current.classList.add('dragging');
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e)=>{
    if(!dragState.current) return;
    const { offsetX, offsetY, parentRect } = dragState.current;
    let x = e.clientX - parentRect.left - offsetX;
    let y = e.clientY - parentRect.top - offsetY;
    x = Math.max(0, Math.min(x, parentRect.width - 200));
    y = Math.max(0, Math.min(y, Math.max(parentRect.height - 100, 400)));
    onDrag(id, x, y);
  };
  const onPointerUp = ()=>{
    dragState.current = null;
    ref.current && ref.current.classList.remove('dragging');
  };

  const style = isDesktop
    ? { left: pos.x+'px', top: pos.y+'px', transform:`rotate(${rotation}deg)` }
    : {};

  return (
    <div
      ref={ref}
      className="free-note"
      style={style}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerLeave={onPointerUp}
    >
      {children}
    </div>
  );
}

/* ============ CLUE CARD ============ */
function ClueCard({ id, pos, isDesktop, rotation, index, text, flipped, onFlip }){
  const style = isDesktop
    ? { left: pos.x+'px', top: pos.y+'px', transform:`rotate(${rotation}deg)` }
    : {};
  return (
    <div className={"clue-card" + (flipped ? " flipped":"")} style={style} onClick={()=>onFlip(id)}>
      <div className="clue-inner">
        <div className="clue-face clue-front">
          <div style={{fontSize:'1.6rem'}}>🔍</div>
          <div>Supporting Clue {index+1}</div>
          <div style={{fontSize:'0.65rem', opacity:0.75, marginTop:6}}>tap to reveal</div>
        </div>
        <div className="clue-face clue-back">{text}</div>
      </div>
    </div>
  );
}

/* ============ INTERACTIVE INVESTIGATION ============ */
function Investigate({ theCase, onProceed }){
  const [isDesktop, setIsDesktop] = useState(window.innerWidth > 760);
  useEffect(()=>{
    const onResize = ()=> setIsDesktop(window.innerWidth > 760);
    window.addEventListener('resize', onResize);
    return ()=> window.removeEventListener('resize', onResize);
  },[]);

  const evidenceDefs = useMemo(()=> ([
    { id:'audience', title:'Target Audience', icon:'🎯', cls:'', render:()=> <p>{theCase.audience}</p> },
    { id:'channels', title:'Marketing Channels', icon:'📡', cls:'alt', render:()=> <ul>{theCase.channels.map(c=><li key={c}>{c}</li>)}</ul> },
    { id:'budget', title:'Budget Allocation', icon:'💰', cls:'', render:()=> <ul>{theCase.budget.map(b=><li key={b.c}>{b.c}: {b.p}%</li>)}</ul> },
    { id:'comments', title:'Customer Comments', icon:'💬', cls:'rose', render:()=> theCase.comments.map((c,i)=><div className="quote" key={i}>{c}</div>) },
    { id:'social', title:'Social Media Performance', icon:'📱', cls:'alt', render:()=> theCase.social.map((s,i)=><div key={i}><b>{s.platform}:</b> {s.stat}</div>) },
    { id:'metrics', title:'Campaign Metrics', icon:'📊', cls:'', render:()=> (
        <ul>
          <li>Reach: {theCase.metrics.reach.v}</li>
          <li>CTR: {theCase.metrics.ctr.v}</li>
          <li>Engagement: {theCase.metrics.engagement.v}</li>
          <li>Conversions: {theCase.metrics.conversions.v}</li>
          <li>Sales: {theCase.metrics.sales.v}</li>
        </ul>
      ) },
  ]), [theCase]);

  const layout = useMemo(()=>{
    const cols = 3;
    const positions = {};
    evidenceDefs.forEach((e,i)=>{
      const col = i % cols, row = Math.floor(i/cols);
      positions[e.id] = { x: 20 + col*250, y: 20 + row*230 };
    });
    theCase.clues.forEach((c,i)=>{
      const col = i % 3;
      positions['clue'+i] = { x: 40 + col*250, y: 20 + Math.ceil(evidenceDefs.length/3)*230 + 10 };
    });
    return positions;
  }, [evidenceDefs, theCase]);

  const rotations = useMemo(()=>{
    const r = {};
    evidenceDefs.forEach(e=> r[e.id] = (Math.random()*8-4).toFixed(1));
    theCase.clues.forEach((c,i)=> r['clue'+i] = (Math.random()*6-3).toFixed(1));
    return r;
  }, [evidenceDefs, theCase]);

  const [positions, setPositions] = useState(layout);
  useEffect(()=> setPositions(layout), [layout]);

  const [flipped, setFlipped] = useState({});
  const revealedCount = Object.values(flipped).filter(Boolean).length;
  const allRevealed = revealedCount >= theCase.clues.length;

  const handleDrag = useCallback((id,x,y)=>{
    setPositions(p=> ({...p, [id]: {x,y}}));
  },[]);
  const handleFlip = (id)=> setFlipped(f=> ({...f, [id]: !f[id]}));

  const boardHeight = isDesktop ? (20 + Math.ceil((evidenceDefs.length)/3)*230 + 230) : 'auto';

  return (
    <div className="screen">
      <div className="investigate-toolbar">
        <h2 className="board-title" style={{margin:0, textAlign:'left'}}>🗂️ Interactive Investigation</h2>
        <div className="clue-progress">Clues uncovered: <b>{revealedCount}/{theCase.clues.length}</b></div>
      </div>
      <p className="board-subtitle" style={{textAlign:'left', marginTop:-14}}>
        Drag the evidence around the board. Tap the red clue cards to flip them over.
      </p>
      <div className={"cork investigate-cork" + (!isDesktop ? " stacked-mobile":"")} style={{minHeight: isDesktop ? boardHeight : 'auto'}}>
        {evidenceDefs.map(e=>(
          <DraggableNote key={e.id} id={e.id} pos={positions[e.id]||{x:0,y:0}} onDrag={handleDrag} isDesktop={isDesktop} rotation={rotations[e.id]}>
            <div className={"sticky " + e.cls}>
              <h5>{e.icon} {e.title}</h5>
              {e.render()}
            </div>
          </DraggableNote>
        ))}
        {theCase.clues.map((c,i)=>(
          <ClueCard
            key={'clue'+i}
            id={'clue'+i}
            index={i}
            text={c}
            pos={positions['clue'+i]||{x:0,y:0}}
            isDesktop={isDesktop}
            rotation={rotations['clue'+i]}
            flipped={!!flipped['clue'+i]}
            onFlip={handleFlip}
          />
        ))}
      </div>
      <div className="panel-actions">
        <button className="btn" disabled={!allRevealed} onClick={onProceed}>
          {allRevealed ? "I'm Ready to Solve the Case →" : `Reveal all clues to proceed (${revealedCount}/${theCase.clues.length})`}
        </button>
      </div>
      {!allRevealed && <p className="hint-text">Flip every red clue card before you can name the culprit mistake.</p>}
    </div>
  );
}

/* ============ SOLVE SCREEN ============ */
function Solve({ theCase, onSolved }){

      </div>

        {options.map((opt,i)=>(
          <div key={i} className={"suspect-card" + (selected===opt ? " selected":"")} onClick={()=>setSelected(opt)}>

}

/* ============ CASE CLOSED ============ */
function CaseClosed({ correct, onNext }){
  const confetti = useMemo(()=>{
    if(!correct) return [];
    return new Array(24).fill(0).map((_,i)=>({
      left: Math.random()*100,
      delay: Math.random()*0.6,
      dur: 2.2+Math.random()*1.6,
      color: ['#d97757','#f0946e','#57c26a','#e2434d','#4fb0e0'][i%5],
      rot: Math.random()*360
    }));
  },[correct]);
  return (
    <div className="screen closed-screen">
      {confetti.map((c,i)=>(
        <div key={i} className="confetti-bit" style={{
          left: c.left+'%',
          background: c.color,
          animationDelay: c.delay+'s',
          animationDuration: c.dur+'s',
          transform:`rotate(${c.rot}deg)`
        }}></div>
      ))}
      <div className={"stamp " + (correct ? "correct":"wrong")}>
        {correct ? "CASE CLOSED" : "CASE MISFILED"}
      </div>
      <p className="closed-sub">
        {correct
          ? "Sharp eyes, detective. You correctly identified the marketing mistake."
          : "Not quite — the real culprit is waiting in your Learning Report."}
      </p>
      <div className="closed-actions">
        <button className="btn" onClick={onNext}>View Learning Report →</button>
      </div>
    </div>
  );
}

function LearningReport({ theCase, correct, stats, onNextCase }){
  return (
    <div className="screen">
      <div className={"verdict-banner " + (correct ? "ok":"no")}>
        <div className="vb-icon">{correct ? "✅":"🕵️"}</div>
        <div>
          <h4>{correct ? "Verdict: Correct" : "Verdict: Missed It"}</h4>
          <p>Case #{String(theCase.id).padStart(3,'0')} — {theCase.company} ({theCase.industry})</p>
        </div>
      </div>

      <div className="stats-row">
        <div className="stat-box"><div className="num">{stats.solved}</div><div className="lbl">Cases Closed</div></div>
        <div className="stat-box"><div className="num">{stats.attempted}</div><div className="lbl">Cases Attempted</div></div>
        <div className="stat-box"><div className="num">{stats.attempted ? Math.round(100*stats.solved/stats.attempted) : 0}%</div><div className="lbl">Accuracy</div></div>
      </div>

      <div className="report-grid">
        <div>
          <div className="report-card">
            <h3>🧩 The Real Story</h3>
            <p>{theCase.explanation}</p>
          </div>
          <div className="report-card">
            <h3>🛠️ Suggested Improvements</h3>
            <ol>
              {theCase.improvements.map((imp,i)=> <li key={i}>{imp}</li>)}
            </ol>
          </div>
        </div>
        <div>
          <div className="report-card">
            <h3>🔍 Supporting Clues Recap</h3>
            <ul>
              {theCase.clues.map((c,i)=> <li key={i}>{c}</li>)}
            </ul>
          </div>
          <div className="report-card">
            <h3>💬 Customer Voice</h3>
            {theCase.comments.map((c,i)=> <p key={i} className="quote">{c}</p>)}
          </div>
        </div>
      </div>

      <div className="footer-actions">
        <button className="btn" onClick={onNextCase}>Investigate Next Case →</button>
      </div>
    </div>
  );
}

/* ============ ROOT APP ============ */
function App(){
  const [theme, setTheme] = useState(null);
  const [screen, setScreen] = useState('brief'); // brief | board | investigate | solve | closed | report
  const [theCase, setTheCase] = useState(()=> randomCase());
  const [lastResult, setLastResult] = useState(null); // { correct, picked }
  const [stats, setStats] = useState({ solved:0, attempted:0 });

  useEffect(()=>{
    if(theme) document.body.setAttribute('data-theme', theme);
  },[theme]);

  if(!theme){
    return <ThemeSelect onPick={(t)=> setTheme(t)} />;
  }

  const stepNumber = { brief:1, board:2, investigate:3, solve:4, closed:5, report:6 }[screen];

  const handleSolved = (correct, picked)=>{
    setLastResult({ correct, picked });
    setStats(s=> ({ solved: s.solved + (correct?1:0), attempted: s.attempted + 1 }));
    setScreen('closed');
  };

  const handleNextCase = ()=>{
    const nc = randomCase(theCase.id);
    setTheCase(nc);
    setLastResult(null);
    setScreen('brief');
  };

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">🔎</div>
          <div>
            Marketing Detective
            <small>{THEME_PRESETS.find(t=>t.key===theme).name} case files</small>
          </div>
        </div>
        <div className="case-tag">Case #{String(theCase.id).padStart(3,'0')} · {theCase.company}</div>
      </div>

      <Stepper current={stepNumber} />

      {screen === 'brief' && (
        <CaseAssignment theCase={theCase} onProceed={()=> setScreen('board')} />
      )}
      {screen === 'board' && (
        <InvestigationBoard theCase={theCase} onProceed={()=> setScreen('investigate')} />
      )}
      {screen === 'investigate' && (
        <Investigate theCase={theCase} onProceed={()=> setScreen('solve')} />
      )}
      {screen === 'solve' && (
        <Solve theCase={theCase} onSolved={handleSolved} />
      )}
      {screen === 'closed' && lastResult && (
        <CaseClosed correct={lastResult.correct} onNext={()=> setScreen('report')} />
      )}
      {screen === 'report' && lastResult && (
        <LearningReport theCase={theCase} correct={lastResult.correct} stats={stats} onNextCase={handleNextCase} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
